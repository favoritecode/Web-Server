<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360"><rect width="800" height="360" rx="24" fill="#effaf8"/><text x="40" y="52" font-family="Arial" font-size="25" font-weight="700" fill="#073b4c">SYNCHRONOUS SPEED</text><circle cx="215" cy="205" r="110" fill="#fff" stroke="#087f8c" stroke-width="8"/><path d="M215 205l65-60" stroke="#ef8354" stroke-width="11" stroke-linecap="round"/><circle cx="215" cy="205" r="12" fill="#073b4c"/><rect x="390" y="95" width="360" height="220" rx="22" fill="#fff" stroke="#20a39e" stroke-width="5"/><text x="570" y="170" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#075e66">Ns = 120f / P</text><text x="570" y="230" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#ef8354">f = PN / 120</text><text x="570" y="280" text-anchor="middle" font-family="Arial" font-size="18" fill="#073b4c">50 Hz, 6 poles = 1000 rpm</text></svg>
