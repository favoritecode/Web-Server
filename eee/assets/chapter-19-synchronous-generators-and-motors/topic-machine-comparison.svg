<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360"><rect width="800" height="360" rx="24" fill="#effaf8"/><text x="40" y="52" font-family="Arial" font-size="25" font-weight="700" fill="#073b4c">SYNCHRONOUS vs INDUCTION</text><rect x="55" y="95" width="320" height="220" rx="22" fill="#fff" stroke="#087f8c" stroke-width="6"/><text x="215" y="145" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#087f8c">SYNCHRONOUS</text><text x="85" y="195" font-family="Arial" font-size="18" fill="#073b4c">• Speed = Ns</text><text x="85" y="235" font-family="Arial" font-size="18" fill="#073b4c">• Excited Rotor</text><text x="85" y="275" font-family="Arial" font-size="18" fill="#073b4c">• Adjustable PF</text><rect x="425" y="95" width="320" height="220" rx="22" fill="#fff" stroke="#ef8354" stroke-width="6"/><text x="585" y="145" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#e63946">INDUCTION</text><text x="455" y="195" font-family="Arial" font-size="18" fill="#073b4c">• Speed &lt; Ns</text><text x="455" y="235" font-family="Arial" font-size="18" fill="#073b4c">• Induced Rotor Current</text><text x="455" y="275" font-family="Arial" font-size="18" fill="#073b4c">• Simple &amp; self-starting</text></svg>
