<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360"><rect width="800" height="360" rx="24" fill="#f4fbfa"/><text x="35" y="50" font-family="Arial" font-size="25" font-weight="700" fill="#073b4c">Back EMF and Motor Current</text><circle cx="240" cy="190" r="95" fill="#d7f2ed" stroke="#087f8c" stroke-width="8"/><text x="195" y="200" font-family="Arial" font-size="28" fill="#075e66">MOTOR</text><path d="M80 190h65M335 190h120" stroke="#ef8354" stroke-width="8"/><path d="M450 150H335" stroke="#e63946" stroke-width="6"/><text x="365" y="130" font-family="Arial" font-size="20" fill="#e63946">Eᵦ opposes V</text><rect x="500" y="105" width="250" height="175" rx="20" fill="#fff" stroke="#20a39e" stroke-width="4"/><text x="545" y="165" font-family="Arial" font-size="24">V = Eᵦ + IₐRₐ</text><text x="535" y="220" font-family="Arial" font-size="24">Iₐ = (V−Eᵦ)/Rₐ</text></svg>
