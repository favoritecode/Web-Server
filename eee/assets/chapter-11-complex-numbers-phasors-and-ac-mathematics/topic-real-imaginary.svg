<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420"><rect width="800" height="420" rx="28" fill="#f2fbfa"/><text x="400" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#073642">Real and Imaginary Components</text><g fill="#dff5f1" stroke="#078987" stroke-width="5"><rect x="70" y="100" width="285" height="210" rx="20"/><rect x="445" y="100" width="285" height="210" rx="20"/></g><g font-family="Arial" fill="#073642" text-anchor="middle"><text x="212" y="155" font-size="27" font-weight="700">Real Part</text><text x="212" y="210" font-size="30">Re(z) = a</text><text x="212" y="265" font-size="20">Horizontal Axis</text><text x="587" y="155" font-size="27" font-weight="700">Imaginary Part</text><text x="587" y="210" font-size="30">Im(z) = b</text><text x="587" y="265" font-size="20">Vertical j Axis</text><text x="400" y="370" font-size="22" font-weight="700">j² = −1 • Conjugate of a + jb is a − jb</text></g></svg>
