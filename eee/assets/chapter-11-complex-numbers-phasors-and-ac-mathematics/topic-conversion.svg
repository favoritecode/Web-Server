<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420"><rect width="800" height="420" rx="28" fill="#f2fbfa"/><text x="400" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#073642">Rectangular ↔ Polar Conversion</text><g fill="#dff5f1" stroke="#078987" stroke-width="5"><rect x="65" y="110" width="270" height="190" rx="20"/><rect x="465" y="110" width="270" height="190" rx="20"/></g><g font-family="Arial" fill="#073642" text-anchor="middle"><text x="200" y="160" font-size="26" font-weight="700">a + jb</text><text x="200" y="210" font-size="20">r = √(a² + b²)</text><text x="200" y="250" font-size="20">θ = atan2(b,a)</text><text x="600" y="160" font-size="26" font-weight="700">r∠θ</text><text x="600" y="210" font-size="20">a = r cos θ</text><text x="600" y="250" font-size="20">b = r sin θ</text><text x="400" y="205" font-size="35" font-weight="700">⇄</text><text x="400" y="365" font-size="21" font-weight="700">Check Quadrant • Check Degree/Radian Mode</text></g></svg>
