<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420"><rect width="800" height="420" rx="28" fill="#f2fbfa"/><text x="400" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#073642">Superposition — One Independent Source at a Time</text><g stroke="#078987" stroke-width="5" fill="none"><rect x="55" y="105" width="200" height="155" rx="16"/><rect x="300" y="105" width="200" height="155" rx="16"/><rect x="545" y="105" width="200" height="155" rx="16"/><path d="M255 182h45M500 182h45"/></g><g font-family="Arial" fill="#073642" text-anchor="middle"><text x="155" y="145" font-size="22" font-weight="700">Source 1 Active</text><text x="155" y="185" font-size="19">Source 2 OFF</text><text x="155" y="225" font-size="24">Response x₁</text><text x="400" y="145" font-size="22" font-weight="700">Source 2 Active</text><text x="400" y="185" font-size="19">Source 1 OFF</text><text x="400" y="225" font-size="24">Response x₂</text><text x="645" y="150" font-size="22" font-weight="700">Total</text><text x="645" y="210" font-size="26">x = x₁ + x₂</text><text x="400" y="325" font-size="20">Voltage source OFF → Short  •  Current source OFF → Open</text><text x="400" y="370" font-size="20" font-weight="700">Superimpose Voltage or Current — Not Power Directly</text></g></svg>
