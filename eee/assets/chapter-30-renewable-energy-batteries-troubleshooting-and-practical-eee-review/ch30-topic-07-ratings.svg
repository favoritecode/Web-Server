<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360"><rect width="800" height="360" fill="#f3fbfa"/><text x="38" y="50" font-family="Arial" font-size="26" font-weight="700" fill="#075e5b">Battery Capacity and Ratings</text><g font-family="Arial" text-anchor="middle"><text x="400" y="130" font-size="42" font-weight="700" fill="#0b8f88">EWh ≈ V × Ah</text><text x="210" y="215" font-size="30" fill="#e67832">Ah = I × t</text><text x="590" y="215" font-size="30" fill="#5267a8">SOC + DOD ≈ 100%</text><text x="400" y="290" font-size="22" fill="#355c63">C-rate • cycle life • temperature • cutoff</text></g></svg>
