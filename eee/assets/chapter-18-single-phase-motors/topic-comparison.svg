<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360"><rect width="800" height="360" rx="24" fill="#effaf8"/><text x="40" y="52" font-family="Arial" font-size="25" font-weight="700" fill="#073b4c">SINGLE-PHASE vs THREE-PHASE</text><rect x="55" y="95" width="310" height="220" rx="22" fill="#fff" stroke="#ef8354" stroke-width="6"/><text x="210" y="145" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#e63946">1φ MOTOR</text><text x="85" y="195" font-family="Arial" font-size="18" fill="#073b4c">• Pulsating field</text><text x="85" y="235" font-family="Arial" font-size="18" fill="#073b4c">• Starting aid required</text><text x="85" y="275" font-family="Arial" font-size="18" fill="#073b4c">• Small domestic loads</text><rect x="435" y="95" width="310" height="220" rx="22" fill="#fff" stroke="#087f8c" stroke-width="6"/><text x="590" y="145" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#087f8c">3φ MOTOR</text><text x="465" y="195" font-family="Arial" font-size="18" fill="#073b4c">• Natural RMF</text><text x="465" y="235" font-family="Arial" font-size="18" fill="#073b4c">• Self-starting</text><text x="465" y="275" font-family="Arial" font-size="18" fill="#073b4c">• Industrial loads</text></svg>
