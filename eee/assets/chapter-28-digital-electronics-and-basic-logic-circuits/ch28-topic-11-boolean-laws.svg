<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360"><rect width="800" height="360" fill="#f3fbfa"/><text x="40" y="52" font-family="Arial" font-size="26" font-weight="700" fill="#075e5b">Boolean Laws</text><g font-family="monospace" font-size="30" fill="#163d45"><text x="80" y="125">A + 0 = A</text><text x="80" y="180">A · 1 = A</text><text x="80" y="235">A + A̅ = 1</text><text x="450" y="125">A + A = A</text><text x="450" y="180">A + AB = A</text><text x="450" y="235">A(A+B) = A</text></g><text x="400" y="300" text-anchor="middle" font-family="Arial" font-size="20" fill="#607a80">Identity • Complement • Idempotent • Absorption</text></svg>
