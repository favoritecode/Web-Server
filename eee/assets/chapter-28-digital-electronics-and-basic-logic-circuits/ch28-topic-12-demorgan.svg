<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360"><rect width="800" height="360" fill="#f7fbfd"/><text x="40" y="52" font-family="Arial" font-size="26" font-weight="700" fill="#075e5b">De Morgan's Theorems</text><g font-family="Arial" text-anchor="middle"><text x="400" y="140" font-size="42" font-weight="700" fill="#0b8f88">(A · B)̅ = A̅ + B̅</text><text x="400" y="215" font-size="42" font-weight="700" fill="#e67832">(A + B)̅ = A̅ · B̅</text><text x="400" y="285" font-size="22" fill="#607a80">Complement every term and interchange AND ↔ OR</text></g></svg>
