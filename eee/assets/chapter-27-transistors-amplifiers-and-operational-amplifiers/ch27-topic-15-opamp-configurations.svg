<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420"><rect width="800" height="420" rx="24" fill="#faf5ff"/><text x="40" y="58" font-family="Arial" font-size="28" font-weight="700">Basic Op-Amp configurations</text><g font-family="Arial" text-anchor="middle"><g fill="#ede9fe" stroke="#7c3aed" stroke-width="4"><rect x="45" y="120" width="220" height="220" rx="20"/><rect x="290" y="120" width="220" height="220" rx="20"/><rect x="535" y="120" width="220" height="220" rx="20"/></g><text x="155" y="175" font-size="25" font-weight="700">Inverting</text><text x="155" y="245" font-size="26">−R<tspan baseline-shift="sub">f</tspan>/R<tspan baseline-shift="sub">in</tspan></text><text x="155" y="300" font-size="18">180° phase</text><text x="400" y="175" font-size="25" font-weight="700">Non-Inverting</text><text x="400" y="245" font-size="26">1 + R<tspan baseline-shift="sub">f</tspan>/R<tspan baseline-shift="sub">g</tspan></text><text x="400" y="300" font-size="18">Same phase</text><text x="645" y="175" font-size="25" font-weight="700">Follower</text><text x="645" y="245" font-size="32">A<tspan baseline-shift="sub">v</tspan> = 1</text><text x="645" y="300" font-size="18">Buffer</text></g></svg>
