<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420"><rect width="800" height="420" rx="24" fill="#f8fafc"/><text x="40" y="58" font-family="Arial" font-size="28" font-weight="700">N-Type and P-Type</text><g font-family="Arial" text-anchor="middle"><rect x="70" y="115" width="300" height="235" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="220" y="165" font-size="30" font-weight="700" fill="#1d4ed8">N-Type</text><text x="220" y="220" font-size="23">Donor impurity</text><text x="220" y="275" font-size="50" fill="#2563eb">e⁻ e⁻ e⁻</text><text x="220" y="320" font-size="18">Electrons = majority</text><rect x="430" y="115" width="300" height="235" rx="24" fill="#ffedd5" stroke="#f97316" stroke-width="4"/><text x="580" y="165" font-size="30" font-weight="700" fill="#c2410c">P-Type</text><text x="580" y="220" font-size="23">Acceptor impurity</text><text x="580" y="275" font-size="50" fill="#f97316">h⁺ h⁺ h⁺</text><text x="580" y="320" font-size="18">Holes = majority</text></g></svg>
