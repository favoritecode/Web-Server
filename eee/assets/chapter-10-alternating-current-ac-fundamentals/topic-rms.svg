<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420"><rect width="800" height="420" rx="28" fill="#f2fbfa"/><text x="400" y="48" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#073642">RMS — Effective Heating Value</text><rect x="90" y="105" width="620" height="205" rx="24" fill="#fff" stroke="#078987" stroke-width="5"/><text x="400" y="180" text-anchor="middle" font-family="Arial" font-size="42" font-weight="700" fill="#073642">Vrms = Vm / √2</text><text x="400" y="235" text-anchor="middle" font-family="Arial" font-size="31" font-weight="700" fill="#078987">≈ 0.707 Vm</text><text x="400" y="285" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#667b83">Pure sine wave only</text><text x="400" y="375" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#073642">230 V RMS ≈ 325 V Peak</text></svg>
